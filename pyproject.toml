[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spynet"
version = "0.1.0"
description = "Web technology analyser — detects frontend, backend, and CDN stacks"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "requests>=2.31,<3",
    "dnspython>=2.4,<3",
    "python-whois>=0.9,<1",
]

[project.scripts]
spynet = "cli:main"

[tool.setuptools]
py-modules = ["cli", "analyzer"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
