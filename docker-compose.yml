version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: spynet_postgres_db
    restart: always
    environment:
      POSTGRES_DB: spynet-db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
